[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gita-embeddings"
version = "0.1.0"
description = "Embedding-based exploratory analysis of the Bhagavad Gita (Easwaran ed.) via Gemini."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=0.8.0",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.4",
  "umap-learn>=0.5.6",
  "plotly>=5.22",
  "networkx>=3.3",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
gita = "gita_embeddings.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
